<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brain — Exploded View</title>
<style>
  :root{
    --bg-0:#0b0d10;
    --bg-1:#111418;
    --line:#e7e5df;
    --caption:#6c7177;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 38%, var(--bg-1) 0%, var(--bg-0) 68%);
    color:var(--caption);
    font-family: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .brain-wrap{
    position:relative;
    width:min(117vmin, 1080px);
    height:min(117vmin, 1080px);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .brain-wrap svg{
    position:absolute; inset:0;
    width:100%; height:100%;
    overflow:visible;
    filter: drop-shadow(0 0 22px rgba(210,225,235,0.08));
  }
  .cls-1{ fill: var(--line); }
  .hit-area{ fill: rgba(0,0,0,0.001); stroke: none; }
  .part{
    transform-box: fill-box;
    transform-origin: center;
    will-change: transform;
    transition: filter .3s ease;
  }
  .part:hover{ filter: drop-shadow(0 0 8px rgba(220,232,240,0.35)); }

  .part .cls-1{ transition: fill .25s ease; }

  /* per-part hover colours, traced from the supplied highlight artwork */
  #part0:hover .cls-1, #part0:focus .cls-1{ fill: #00aeef; }  /* frontal lobe   — blue   — Systems Integration */
  #part1:hover .cls-1, #part1:focus .cls-1{ fill: #ed1c24; }  /* parietal piece — red    — Application Development */
  #part2:hover .cls-1, #part2:focus .cls-1{ fill: #fff200; }  /* temporal lobe  — yellow — Helpdesk Support */
  #part3:hover .cls-1, #part3:focus .cls-1{ fill: #00a651; }  /* central lobe   — green  — Disaster Recovery */
  #part4:hover .cls-1, #part4:focus .cls-1{ fill: #ee4097; }  /* cerebellum     — pink   — Cloud Solutions */
  #part5:hover .cls-1, #part5:focus .cls-1{ fill: #00aeef; }  /* brainstem      — blue   — Business Solutions */

  #part0:hover, #part0:focus{ filter: drop-shadow(0 0 12px rgba(0,174,239,0.55)); }
  #part1:hover, #part1:focus{ filter: drop-shadow(0 0 12px rgba(237,28,36,0.55)); }
  #part2:hover, #part2:focus{ filter: drop-shadow(0 0 12px rgba(255,242,0,0.55)); }
  #part3:hover, #part3:focus{ filter: drop-shadow(0 0 12px rgba(0,166,81,0.55)); }
  #part4:hover, #part4:focus{ filter: drop-shadow(0 0 12px rgba(238,64,151,0.55)); }
  #part5:hover, #part5:focus{ filter: drop-shadow(0 0 12px rgba(0,174,239,0.55)); }

  .hint{
    position:absolute;
    left:50%; bottom:8.5%;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:.04em;
    color:var(--caption);
    opacity:0.85;
    transition:opacity .6s ease;
    pointer-events:none;
    text-align:center;
    white-space:nowrap;
  }
  .hint.fade{ opacity:0; }

  .hit-area{ cursor:pointer; }

  .part-label{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%, calc(-100% - 14px));
    display:flex; align-items:center; gap:8px;
    padding:7px 14px;
    background:rgba(11,13,16,.94);
    border:1px solid var(--pc, #8A93A3);
    border-radius:999px;
    font:400 11px/1 -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#EDEFF2;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    z-index:20;
  }
  .part-label .dot{ width:7px; height:7px; border-radius:50%; background:var(--pc, #8A93A3); flex:none; }

  .credit{
    position:absolute;
    top:22px; left:24px;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--caption);
    opacity:.55;
    text-transform:uppercase;
  }
</style>
<script>
  if (/[?&]transparent=1\b/.test(location.search)) {
    document.write('<style>html,body{background:transparent !important;}</style>');
  }
</script>

    for (var i = 0; i < hoverT.length; i++){
      hoverT[i] += (hoverTarget[i] - hoverT[i]) * 0.18;
      if (Math.abs(hoverTarget[i] - hoverT[i]) < 0.001) hoverT[i] = hoverTarget[i];
    }
    render();
    requestAnimationFrame(frame);
  }

  function goToPage(idx){
    var info = PART_INFO[idx];
    if (info && info.href) window.top.location.href = info.href;
  }

  parts.forEach(function(part, idx){
    part.setAttribute('tabindex', '0');
    part.setAttribute('role', 'link');
    var lb = labels[idx];
    part.setAttribute('aria-label', 'Visit ' + (lb ? lb.textContent.trim() : 'service') + ' page');

    // Mouse proximity is handled globally by the magnetic pull in frame();
    // focus/blur cover keyboard users the same way a close cursor would.
    part.addEventListener('focus', function(){
      focusBoost[idx] = 1;
      if (!hasInteracted){
        hasInteracted = true;
        hint.classList.add('fade');
      }
    });
    part.addEventListener('blur', function(){
      focusBoost[idx] = 0;
    });
    part.addEventListener('click', function(){ goToPage(idx); });
    part.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        goToPage(idx);
      }
    });
  });

  try {
    requestAnimationFrame(frame);
  } catch (err) {
    console.error('Brain init error:', err);
  }
})();
</script>

</html>
